<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6fa83f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gród" />
    <link rel="apple-touch-icon" href="/icons/icon.png" />
    <title>Gród</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2b2016;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Menus sit in solid bands above and below the map, never over it. */
      body {
        display: flex;
        flex-direction: column;
      }
      #top-band,
      #bottom-band {
        flex: none;
        background: #1f170f;
        touch-action: manipulation;
      }
      #top-band {
        border-bottom: 3px solid #5c4326;
        padding-top: env(safe-area-inset-top);
      }
      #bottom-band {
        border-top: 3px solid #5c4326;
        padding-bottom: env(safe-area-inset-bottom);
      }
      #app {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        touch-action: none;
      }
      #app canvas {
        display: block;
      }
      #version-label {
        position: fixed;
        right: 6px;
        bottom: 4px;
        font-family: sans-serif;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.55);
        pointer-events: none;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="top-band"></div>
    <div id="app"></div>
    <div id="bottom-band"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
